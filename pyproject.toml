[project]
name = "funllmchat"
version = "0.0.2"
description = "用于在 PyPI 保留 funllmchat 包名的占位 Python 包。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["funbuild>=1.6.66", "pytest>=8.0", "ruff>=0.16.10"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funllmchat"
Releases = "https://github.com/farfarfun/funllmchat/releases"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funllmchat"]

[tool.ruff]
target-version = "py310"
